<article>
    <header><h2>Add New Weapon Type</h2></header>
  
    <form class="container" #form="ngForm" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-4 p-2">
          <div>
            <label for="category">Category:</label>
            <input 
              id="category" 
              name="category" 
              [(ngModel)]="weaponType.category" 
              required
            />
          </div>
        </div>
      </div>
  
      <div class="row">
        <div class="col-4 p-2">
          <div>
            <label for="description">Description:</label>
            <input 
              id="description" 
              name="description" 
              [(ngModel)]="weaponType.description" 
              required
            />
          </div>
        </div>
      </div>
  
      <div class="row">
        <div class="col-2 p-2">
          <button type="submit" [disabled]="!form.valid">Add Weapon Type</button>
        </div>
        <div class="col-2 p-2">
          <button type="button" (click)="form.resetForm()">Reset</button>
        </div>
      </div>
    </form>
  </article>
